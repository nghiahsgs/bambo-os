# BamboOS lock screen (Tessera)
general {
    hide_cursor = true
}
background {
    monitor =
    color = rgb(101012)
}
label {
    monitor =
    text = $TIME
    color = rgb(f4f4f5)
    font_size = 72
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    inner_color = rgb(161618)
    outer_color = rgba(ffffff14)
    check_color = rgb(5b8def)
    fail_color = rgb(ff8a4c)
    font_color = rgb(f4f4f5)
    font_family = Inter
    fade_on_empty = false
    rounding = 12
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
}
