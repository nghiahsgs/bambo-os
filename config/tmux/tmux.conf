# BamboOS tmux. Prefix is Ctrl-a. Tuned for long agent sessions.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g status-style "bg=#101012,fg=#8e8e96"
set -g status-left "#[fg=#5b8def,bold] #S "
set -g status-right "#[fg=#8e8e96]%H:%M "
setw -g window-status-current-style "fg=#f4f4f5,bold"
set -g pane-border-style "fg=#161618"
set -g pane-active-border-style "fg=#5b8def"
set -g message-style "bg=#161618,fg=#f4f4f5"
