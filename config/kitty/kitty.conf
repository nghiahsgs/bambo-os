# BamboOS kitty (Tessera)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

window_padding_width    12
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam
scrollback_lines        10000
shell_integration       enabled

foreground            #f4f4f5
background            #101012
selection_foreground  #101012
selection_background  #5b8def
cursor                #5b8def
cursor_text_color     #101012
url_color             #5b8def
active_border_color   #5b8def
inactive_border_color #161618

active_tab_foreground   #f4f4f5
active_tab_background   #161618
inactive_tab_foreground #8e8e96
inactive_tab_background #101012

color0  #161618
color8  #8e8e96
color1  #f0616d
color9  #f0616d
color2  #3ecf8e
color10 #3ecf8e
color3  #ff8a4c
color11 #ff8a4c
color4  #5b8def
color12 #5b8def
color5  #b18cf2
color13 #b18cf2
color6  #56c8d8
color14 #56c8d8
color7  #f4f4f5
color15 #ffffff

# Selecting text with the mouse copies it. bambo-copied shows a short note.
copy_on_select clipboard
strip_trailing_spaces smart
