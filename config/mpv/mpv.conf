# BamboOS is Wayland only. Naming the context lets mpv draw through Mesa even
# when there is no GPU (a VM): its own probing refuses a software renderer and
# then ends with no video output at all. wlshm is the plain CPU fallback.
vo=gpu,wlshm
gpu-context=wayland
hwdec=auto-safe
keep-open=yes
osd-font=Inter
sub-font=Inter
osd-bar=no
border=no
